<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMU Chat Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=2.1" />
  </head>
  <body>
    <div class="page-bg"></div>

    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">BMU</div>
        <div class="brand-text">
          <p class="brand-title">BML Munjal University</p>
          <p class="brand-subtitle">Chat Assistant</p>
        </div>
      </div>

      <div class="control-cluster">
        <!-- LLM Selector Toggle -->
        <div class="control-item" title="Switch between Cloud Groq and Local Ollama LLM">
          <span class="control-label">LLM Provider</span>
          <div class="segmented-control" id="llmToggleGroup" role="radiogroup" aria-label="LLM Provider Selection">
            <button
              type="button"
              id="llmCloudBtn"
              class="seg-btn active"
              data-provider="groq"
              role="radio"
              aria-checked="true"
            >
              <span class="seg-icon">☁️</span> Cloud (Groq)
            </button>
            <button
              type="button"
              id="llmLocalBtn"
              class="seg-btn"
              data-provider="local"
              role="radio"
              aria-checked="false"
            >
              <span class="seg-icon">💻</span> Local LLM
            </button>
          </div>
        </div>

        <!-- Guardrails Toggle Switch -->
        <div class="control-item" title="Toggle JEV security & factual grounding guardrails">
          <span class="control-label">JEV Guardrails</span>
          <div class="switch-wrap">
            <label class="toggle-switch" for="guardrailsToggle" aria-label="Toggle Guardrails">
              <input type="checkbox" id="guardrailsToggle" checked />
              <span class="slider"></span>
            </label>
            <span class="switch-status-text active" id="guardrailsStatusText">ON</span>
          </div>
        </div>

        <a href="evaluation.html" class="eval-nav-btn" title="Open 100-Question Model Evaluation Observatory">
          📊 Benchmark Observatory
        </a>
        <a href="http://localhost:6006" target="_blank" class="eval-nav-btn phoenix-btn" title="Open Arize Phoenix Tracing & Observability UI">
          🔭 Arize Phoenix
        </a>
      </div>
    </header>

    <main class="main-layout">
      <section class="chat-shell" aria-label="BMU chatbot">
        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>

        <div class="suggestions">
          <button class="suggestion-btn" type="button" data-query="Courses offered">Courses offered</button>
          <button class="suggestion-btn" type="button" data-query="Faculty details">Faculty details</button>
          <button class="suggestion-btn" type="button" data-query="Admissions process">Admissions process</button>
        </div>

        <form id="chatForm" class="input-row" autocomplete="off">
          <input
            id="queryInput"
            class="chat-input"
            type="text"
            name="query"
            placeholder="Ask your question"
            required
          />
          <button id="sendBtn" class="send-btn" type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="./app.js?v=2.1"></script>
  </body>
</html>
